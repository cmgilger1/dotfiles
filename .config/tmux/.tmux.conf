#remap prefix from C-b to C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# design changes
set -g terminal-overrides ',xterm-256color:Tc'
set -g default-terminal "screen-256color"
set -as terminal-overrides ',xterm*:sitm=\E[3m'
set -g visual-bell off

# vim-mode copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# Smart pane switching with awareness of vim splits
bind -n C-k run-shell 'tmux-vim-select-pane -U'
bind -n C-j run-shell 'tmux-vim-select-pane -D'
bind -n C-h run-shell 'tmux-vim-select-pane -L'
bind -n C-l run-shell 'tmux-vim-select-pane -R'
bind -n "C-\\" run-shell 'tmux-vim-select-pane -l'

# Bring back clear screen under tmux prefix
bind C-l send-keys 'C-l'

set -sg escape-time 10

# open splits and windows in the current folder
bind u split-window -p 30 -c "#{pane_current_path}"
bind i split-window -p 50 -h -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"

# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on

# empty input box when renaming
bind-key , command-prompt -p "Name of window: " "rename-window '%%'"
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'
set-option -g history-limit 10000

# Nightfox colors for Tmux
# Style: nightfox
# Upstream: https://github.com/edeneast/nightfox.nvim/raw/main/extra/nightfox/nightfox.tmux
# nightfox ==> everforest (light) ==> everforest (dark)
# 4682b4   ==> 708089             ==> efebd4
# 131a24   ==> efebd4             ==> 3d484d
set -g mode-style "fg=#3d484d,bg=#efebd4"
set -g message-style "fg=#3d484d,bg=#efebd4"
set -g message-command-style "fg=#3d484d,bg=#efebd4"
set -g pane-border-style "fg=#efebd4"
set -g pane-active-border-style "fg=#719cd6"
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#efebd4,bg=#3d484d"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left "#[fg=#3d484d,bg=#efebd4,nobold] #S #[fg=#efebd4,bg=#3d484d,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#3d484d,bg=#3d484d,nobold,nounderscore,noitalics]#[fg=#719cd6,bg=#3d484d] #{prefix_highlight} #[fg=#efebd4,bg=#3d484d,nobold,nounderscore,noitalics]#[fg=#3d484d,bg=#efebd4] %Y-%m-%d  %I:%M %p "
setw -g window-status-activity-style "underscore,fg=#71839b,bg=#3d484d"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#efebd4,bg=#3d484d"
setw -g window-status-format "#[fg=#3d484d,bg=#3d484d,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#3d484d,bg=#3d484d,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#3d484d,bg=#efebd4,nobold,nounderscore,noitalics]#[fg=#3d484d,bg=#efebd4,bold] #I  #W #F #[fg=#efebd4,bg=#3d484d,nobold,nounderscore,noitalics]"

# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
