import = [
    "~/repos/dotfiles/.config/alacritty/themes/themes/carbonfox.toml"
]
[shell]
program = 'fish'

[window]
startup_mode = "Maximized"
dynamic_title = true
# title = "terminal"

[font]
normal = { family = "Agave Nerd Font", style = "Regular" }
size = 10 

[selection]
save_to_clipboard = true

[keyboard]
bindings = [
    { key = "n", mods = "Control|Shift", action = "CreateNewWindow"}
]
